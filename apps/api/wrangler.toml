name = "fplq"
main = "src/worker.ts"
compatibility_date = "2026-08-01"

# One Worker serves both the API (/api/*) and the built web app. Static files are
# served directly from the ASSETS binding; any non-file path falls back to
# index.html so client-side routes (/planner, /fixtures, /league/:id) resolve.
# Directory is relative to this config (apps/api) -> the web build output.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
FPLQ_TRACKED_ENTRIES = "1965441"

[[d1_databases]]
binding = "DB"
database_name = "fplq"
database_id = "0a849dea-9144-4cd0-bc84-8363fe6906ae"
migrations_dir = "migrations"

# Cron runs every minute; the scheduled handler samples every minute while live and
# only on 15-minute marks when idle (see worker.ts).
[triggers]
crons = ["* * * * *"]
